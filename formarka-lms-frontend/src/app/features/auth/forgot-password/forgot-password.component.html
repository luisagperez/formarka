<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/logo%20formarka.png" alt="Formarka Logo" class="logo" onerror="this.src='https://placehold.co/150x50?text=FORMARKA'">
      <h1>Recuperar Contraseña</h1>
      <p>Ingresa tu correo para recibir un enlace de recuperación</p>
    </div>

    <div *ngIf="!isSent; else successMessage">
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <app-form-field
          label="Correo Electrónico"
          [control]="getEmailControl()"
          type="email"
          placeholder="tu@email.com">
        </app-form-field>

        <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

        <app-button 
          type="submit" 
          [loading]="isLoading"
          [disabled]="forgotForm.invalid">
          Enviar Enlace
        </app-button>
      </form>
    </div>

    <ng-template #successMessage>
      <div class="success-message">
        <span class="success-icon">📧</span>
        <h2>¡Correo enviado!</h2>
        <p>Hemos enviado un enlace de recuperación a tu correo electrónico. Por favor, revisa tu bandeja de entrada.</p>
        <app-button routerLink="/auth/login">Volver al Login</app-button>
      </div>
    </ng-template>

    <div class="auth-footer" *ngIf="!isSent">
      <p>¿Recordaste tu contraseña? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
