<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/logo%20formarka.png" alt="Formarka Logo" class="logo" onerror="this.src='https://placehold.co/150x50?text=FORMARKA'">
      <h1>Nueva Contraseña</h1>
      <p>Ingresa tu nueva contraseña para recuperar el acceso</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <app-form-field
        label="Nueva Contraseña"
        [control]="getPasswordControl()"
        type="password"
        placeholder="Mínimo 6 caracteres">
      </app-form-field>

      <app-form-field
        label="Confirmar Contraseña"
        [control]="getConfirmPasswordControl()"
        type="password"
        placeholder="Repite tu contraseña">
      </app-form-field>

      <p class="error-text" *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched">
        Las contraseñas no coinciden.
      </p>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <app-button 
        type="submit" 
        [loading]="isLoading"
        [disabled]="resetForm.invalid">
        Actualizar Contraseña
      </app-button>
    </form>

    <div class="auth-footer">
      <p>¿Recordaste tu contraseña? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
