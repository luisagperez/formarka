<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="verify-icon">✉️</div>
      <h1>¡Verifica tu correo!</h1>
      <p>Hemos enviado un enlace de confirmación a tu dirección de correo electrónico.</p>
    </div>

    <div class="verify-content">
      <p>Para poder continuar y completar tu perfil, por favor haz clic en el enlace que te enviamos.</p>
      <div class="alert-info">
        <p><strong>¿No recibiste el correo?</strong> Revisa tu carpeta de spam o correo no deseado.</p>
      </div>
    </div>

    <div class="verify-footer">
      <app-button routerLink="/auth/login" variant="primary">
        Ir al Inicio de Sesión
      </app-button>
    </div>
  </div>
</div>
